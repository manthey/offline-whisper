<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Whisper Mobile Test</title>
    <script src="/obsidian-mock.js"></script>
    <script>
      window.transformersReady = false;
      window.plugin = null;
      window.module = { exports: {} };
      window.exports = window.module.exports;
      window.require = function (moduleName) {
        if (moduleName === 'obsidian') {
          return window.obsidianMock;
        }
        throw new Error('Unexpected require: ' + moduleName);
      };
    </script>
    <script src="/main.js"></script>
    <script>
      async function initializePlugin() {
        console.log('Instantiating plugin from bundled main.js');
        const WhisperTranscriptionPlugin = window.module.exports;
        const app = {
          workspace: {
            getActiveViewOfType() {
              return { editor: null };
            },
          },
        };
        const manifest = { dir: '.obsidian/plugins/offline-whisper' };
        const plugin = new WhisperTranscriptionPlugin(app, manifest);
        plugin.settings.modelId = 'onnx-community/whisper-tiny.en';
        window.plugin = plugin;
        await plugin.onload();
        const loaded = await plugin.loadModel();
        if (!loaded) {
          throw new Error('loadModel returned false');
        }
        window.transformersReady = true;
      }

      window.runTranscription = async function (audioData) {
        if (!window.plugin || !window.plugin.transcriber) {
          throw new Error('Transcriber not initialized');
        }
        console.log('Running transcription on ' + audioData.length + ' samples');
        const startTime = Date.now();
        const result = await window.plugin.transcriber(audioData);
        const duration = Date.now() - startTime;
        console.log('Transcription completed in ' + duration + 'ms');
        return result;
      };

      initializePlugin().catch((error) => {
        console.error('Initialization failed: ' + error.message);
        window.initError = error.message;
      });
    </script>
  </head>
  <body>
    <h1>Whisper Mobile Test</h1>
    <p>This page tests the transformers.js transcription pipeline.</p>
  </body>
</html>
