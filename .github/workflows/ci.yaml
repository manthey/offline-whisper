name: Test Obsidian Plugin

on:
  push:
    branches: ['**']
  pull_request:
  release:
    types: [published]
  schedule:
    # Weekly check that the plugin's download links still resolve and that
    # binaries and models still download and transcribe on all platforms.
    - cron: '30 5 * * 1'

permissions:
  contents: write
  id-token: write

jobs:
  test-desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run desktop test
        run: npx nyc node tests/test_desktop.js
        env:
          EXPECTED_PHRASE: this is a test
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: '--require ${{ github.workspace }}/tests/patch_header.js'
      - name: Run jest test
        run: npx jest
        env:
          EXPECTED_PHRASE: this is a test
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: '--require ${{ github.workspace }}/tests/patch_header.js'

  test-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright
        run: npx playwright install chromium --with-deps
      - name: Build
        run: node build.js --coverage
      - name: Run UI tests
        run: npx jest
      - name: Run mobile test
        run: npx nyc --clean false node tests/test_mobile.js
        env:
          EXPECTED_PHRASE: this is a test
      - name: Run jest test
        run: npx jest
        env:
          EXPECTED_PHRASE: this is a test

  build:
    needs:
      - test-desktop
      - test-mobile
    runs-on: ubuntu-latest
    if: github.event_name != 'release' && needs.test-desktop.result == 'success' && needs.test-mobile.result == 'success'
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Delete existing latest release
        if: github.event_name == 'push' && github.ref_name == 'master'
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release delete latest --cleanup-tag --yes
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Update latest release
        if: github.event_name == 'push' && github.ref_name == 'master'
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_ACTION_GH_RELEASE_QUIET: 'true'
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Latest
          body: Master branch
          files: |
            main.js
            manifest.json
          fail_on_unmatched_files: false
          prerelease: true
          make_latest: true
          generate_release_notes: false
      - name: Generate artifact attestation
        if: github.event_name == 'push' && github.ref_name == 'master'
        uses: actions/attest@v4
        with:
          subject-path: 'main.js'

  release:
    needs:
      - test-desktop
      - test-mobile
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Validate tag
        run: |
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag '$TAG' must be a bare x.y.z version (no v prefix)"
            exit 1
          fi
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - name: Set version from tag
        run: |
          npm version "$TAG" --no-git-tag-version --allow-same-version
          jq --arg v "$TAG" '.version = $v' manifest.json > tmp.json && mv tmp.json manifest.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Attach assets to the release
        run: gh release upload "$TAG" main.js manifest.json --clobber
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: 'main.js'
      - name: Commit version to master
        if: ${{ !github.event.release.prerelease }}
        run: |
          git fetch origin master
          git checkout -f -B master origin/master
          npm version "$TAG" --no-git-tag-version --allow-same-version
          jq --arg v "$TAG" '.version = $v' manifest.json > tmp.json && mv tmp.json manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json manifest.json
          git diff --cached --quiet || git commit -m "Release $TAG"
          git push origin master
